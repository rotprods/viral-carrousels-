name: Repository Browser QA

on:
  push:
  pull_request:

jobs:
  repository-artifact-playwright:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Stage repository Pages artifact exactly as deploy workflow
        run: |
          rm -rf _site
          mkdir -p _site
          cp -R docs/. _site/
          cp -R prompts templates skills adapters _site/
      - name: Serve staged repository artifact
        run: |
          python3 -m http.server 4173 -d _site >/tmp/course-http.log 2>&1 &
          sleep 2
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
