name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconstruct exact student artifact
        run: |
          cat site-bundle/site.zip.b64.part* > /tmp/site.b64
          base64 -d /tmp/site.b64 > /tmp/site.zip
          mkdir -p _site
          unzip -q /tmp/site.zip -d _site
      - name: Validate before deploy
        run: |
          pip install beautifulsoup4
          python scripts/qa.py _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
