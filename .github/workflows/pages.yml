name: Deploy GitHub Pages

# Pages publication is intentionally manual until the repository Pages site
# is enabled at repository level. This prevents an infrastructure/bootstrap
# failure from painting every main commit red while keeping the deploy path
# available for explicit verification.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Stage exact repository Pages artifact
        run: |
          rm -rf _site
          mkdir -p _site
          cp -R docs/. _site/
          cp -R prompts templates skills adapters _site/
      - name: Validate repository Pages artifact before deploy
        run: |
          pip install beautifulsoup4
          python scripts/qa.py _site/index.html
      - name: Configure existing GitHub Pages site
        uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
