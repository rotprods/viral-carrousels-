name: Repository Static QA

on:
  push:
  pull_request:

jobs:
  repository-artifact-static-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Stage repository Pages artifact
        run: |
          rm -rf _site
          mkdir -p _site
          cp -R docs/. _site/
          cp -R prompts templates skills adapters _site/
      - name: Validate repository Pages artifact
        run: |
          pip install beautifulsoup4
          python scripts/qa.py _site/index.html
